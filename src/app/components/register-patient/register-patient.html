<<form [formGroup]="patientForm" class="p-4">
    <div class="grid">
        <div class="col-9">
            <div class="grid">
                <div class="col-6 mb-3">
                    <label class="block mb-2 font-bold">CI</label>
                    <input pInputText formControlName="dni" class="w-full" placeholder="Ingresar">
                </div>
                <div class="col-6 mb-3">
                    <label class="block mb-2 font-bold">Nombre</label>
                    <input pInputText formControlName="name" class="w-full" placeholder="Ingresar">
                </div>
                <div class="col-6 mb-3">
                    <label class="block mb-2 font-bold">Apellido</label>
                    <input pInputText formControlName="lastName" class="w-full" placeholder="Ingresar">
                </div>
                <div class="col-6 mb-3">
                    <label class="block mb-2 font-bold">Sexo</label>
                    <p-select 
                        [options]="genders" 
                        formControlName="gender" 
                        placeholder="Seleccionar" 
                        class="w-full">
                    </p-select>
                </div>
                <div class="col-6 mb-3">
                    <label class="block mb-2 font-bold">Fecha de Nacimiento</label>
                    <p-datepicker 
                        formControlName="birthDate" 
                        class="w-full" 
                        [showIcon]="true" 
                        placeholder="dd/mm/aaaa">
                    </p-datepicker>
                </div>
                <div class="col-6 mb-3">
                    <label class="block mb-2 font-bold">Celular</label>
                    <input pInputText formControlName="phone" class="w-full" placeholder="Ingresar">
                </div>
                <div class="col-12 mb-3">
                    <label class="block mb-2 font-bold">Correo</label>
                    <input pInputText formControlName="email" class="w-full" placeholder="Ingresar">
                </div>
            </div>
        </div>
    </div>

    <div class="flex justify-content-end mt-4 gap-2">
        <p-button label="Cancelar" (onClick)="cancel()" styleClass="p-button-outlined p-button-info"></p-button>
        <p-button label="Guardar" (onClick)="save()" styleClass="p-button-info"></p-button>
    </div>
</form>>
